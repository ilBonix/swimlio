<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#031526">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SWIMLIO">
  <title>SWIMLIO · Smart Swim Training</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css?v=4.5">
</head>
<body>
  <header class="appHeader">
    <div class="headerInner">
      <div class="logoLockup">
        <div class="logoMark" aria-hidden="true">
          <svg viewBox="0 0 64 64"><path d="M9 22c7-8 14-10 22-6 8 4 14 3 24-5-5 11-14 17-24 14-9-3-14-3-22 2V22Z"/><path d="M9 37c8-7 15-8 23-4 8 4 14 3 23-4-4 10-13 16-23 13-9-3-15-3-23 2v-7Z" opacity=".8"/></svg>
        </div>
        <div><div class="brand">SWIM<em>LIO</em></div><div class="tagline">Planifica · Nada · Evoluciona</div></div>
      </div>
      <div class="versionBadge">4.5</div>
    </div>
  </header>

  <main class="wrap">
    <nav class="navbar" aria-label="Navegación principal">
      <button class="on" data-view="today"><span>◉</span>Hoy</button>
      <button data-view="plan"><span>▦</span>Semana</button>
      <button data-view="history"><span>▥</span>Historial</button>
      <button data-view="profiles"><span>◎</span>Perfiles</button>
    </nav>

    <section id="todayView" class="view"></section>
    <section id="planView" class="view hiddenView"></section>
    <section id="historyView" class="view hiddenView"></section>
    <section id="profilesView" class="view hiddenView"></section>
  </main>

  <div id="overlayRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js?v=4.5"></script>
</body>
</html>
